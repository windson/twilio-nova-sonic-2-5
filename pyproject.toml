[project]
name = "ar-collections-nova-sonic"
version = "0.1.0"
description = "AI-first-initiated outbound Accounts Receivable Collections voice agent bridging Twilio Media Streams to Amazon Bedrock Nova Sonic 2.5 via Strands bi-di agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Native asynchronous tools, bidirectional streaming, and OTEL integration.
    "strands-agents[bidi]==1.62.0",
    # Match the Bedrock runtime API range required by the pinned Strands extra.
    "aws-sdk-bedrock-runtime>=0.11,<0.12",
    "boto3",
    # Post-call execution of date-resolution Python programs.
    "bedrock-agentcore>=1.24,<2",
    "fastapi",
    "uvicorn[standard]",
    "twilio",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
