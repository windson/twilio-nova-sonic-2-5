[project]
name = "ar-collections-nova-sonic"
version = "0.1.0"
description = "AI-first-initiated outbound Accounts Receivable Collections voice agent bridging Twilio Media Streams to Amazon Bedrock Nova Sonic 2.5 via Strands bi-di agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # GA Strands Bidi Agents: strands.bidi namespace (BidiAgent,
    # BedrockNovaSonicModel, AudioIO) plus GA OTEL telemetry
    # (strands.telemetry.StrandsTelemetry). First shipped around 1.54.0;
    # 1.61.1 is confirmed to contain strands/bidi/. The experimental
    # strands.experimental.bidi namespace is retained as a shim in GA.
    "strands-agents[bidi]>=1.61,<2",
    # The GA strands.bidi.models.bedrock provider imports the newer
    # AsyncBedrockRuntimeClient / AsyncBedrockRuntimeConfig / HTTPAuthSchemeResolver
    # / SigV4AuthScheme symbols from aws-sdk-bedrock-runtime. The old
    # experimental model needed BedrockRuntimeClient + config.Config, which the
    # <0.10.0 pin preserved; the GA model needs the >=0.11 API instead. The
    # strands-agents[bidi] extra itself requires >=0.11,<0.12 (py>=3.12), so
    # align the direct pin with that range.
    "aws-sdk-bedrock-runtime>=0.11,<0.12",
    "boto3",
    # AWS Bedrock AgentCore Code Interpreter client used off the real-time
    # audio path (post-call async) to resolve natural-language dates by
    # writing-and-executing Python on the fly. Installed as 1.24.2 during
    # investigation; floor-pinned below 2.x.
    "bedrock-agentcore>=1.24,<2",
    "fastapi",
    "uvicorn[standard]",
    "twilio",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
