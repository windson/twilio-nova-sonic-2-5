AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AR Collections Nova Sonic 2.5 Agent - ECS Fargate service behind an
  Application Load Balancer (WebSocket/WSS capable) bridging Twilio Media
  Streams to Amazon Bedrock Nova Sonic 2.5. Provisions DynamoDB persistence,
  CloudWatch logs + dashboard, a CloudTrail management-event trail, and a
  least-privilege IAM task role scoped to the Nova Sonic model.

Parameters:
  ContainerImage:
    Type: String
    Description: >-
      Full ECR image URI for the app (e.g.
      <acct>.dkr.ecr.us-east-1.amazonaws.com/ar-collections-nova-sonic:latest).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to run the Fargate service and ALB.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets (different AZs) for the ALB and tasks.
  NovaModelId:
    Type: String
    Default: amazon.nova-2-5-sonic
    Description: Bedrock Nova Sonic 2.5 model id (verified streaming in us-east-1).
  TwilioAccountSidArn:
    Type: String
    Description: >-
      Secrets Manager secret ARN (or SSM parameter ARN) that holds the Twilio
      account SID. Referenced by ARN only - never inline the value.
  TwilioAuthTokenArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio auth token.
  TwilioFromNumberArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio from number.
  TwilioVerifiedCallerIdArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio verified caller id.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Number of Fargate tasks to run.
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch log retention (days) for the app log group.
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate ARN for the HTTPS:443 listener. REQUIRED for live Twilio
      Media Streams, which only connect over wss:// (TLS). Leave empty to
      provision an HTTP:80-only ALB (health checks / internal testing only -
      Twilio will refuse a plaintext ws:// endpoint).
  PublicHostname:
    Type: String
    Default: ""
    Description: >-
      Public DNS hostname that resolves (via a CNAME/alias) to the ALB and that
      the ACM certificate in CertificateArn is issued for, e.g.
      collections.example.com. When set, PUBLIC_BASE_URL is this hostname so
      TwiML emits wss://<hostname>/media. Must be used together with
      CertificateArn for a live call.
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Option 1 (CloudFront TLS front door). When "true", provision an Amazon
      CloudFront distribution in front of the HTTP:80 ALB to obtain a free
      AWS-managed *.cloudfront.net TLS hostname so Twilio Media Streams can
      connect over wss://<dist>.cloudfront.net/media WITHOUT a custom domain or
      ACM certificate. When "true", PUBLIC_BASE_URL and the PublicBaseUrl output
      resolve to the CloudFront domain, AND the ALB ingress is locked down to
      the CloudFront origin-facing managed prefix list so the raw ALB DNS can no
      longer be reached directly over plaintext (the CloudFront edge becomes the
      only ingress path). Leave "false" to keep the plain HTTP:80/ALB (or the
      ACM custom-domain) behavior with open ingress.
  CloudFrontOriginFacingPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: >-
      AWS-managed prefix list id for com.amazonaws.global.cloudfront.origin-facing
      in this region (us-east-1 default: pl-3b927c52). Used to restrict the ALB
      security group ingress to CloudFront edge IPs only when EnableCloudFront is
      "true", enforcing the CloudFront TLS front door and closing the plaintext
      ws://<alb-dns>/media bypass. Resolve with:
      aws ec2 describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
      --region us-east-1.

Conditions:
  # HTTPS/WSS is enabled only when an ACM certificate ARN is supplied, so the
  # template still validates and deploys (HTTP:80 only) without a real cert.
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  # Prefer the real TLS hostname for PUBLIC_BASE_URL when provided.
  HasPublicHostname: !Not [!Equals [!Ref PublicHostname, ""]]
  # Option 1: gate the CloudFront distribution + its outputs / PUBLIC_BASE_URL
  # branch so the template still validates and deploys when CloudFront is off.
  EnableCf: !Equals [!Ref EnableCloudFront, "true"]
  # Inverse of EnableCf: open ALB ingress (0.0.0.0/0) only when CloudFront is
  # off. When CloudFront is on, ingress is locked to the managed prefix list.
  CloudFrontDisabled: !Not [!Equals [!Ref EnableCloudFront, "true"]]

Resources:
  # --- DynamoDB persistence --------------------------------------------------
  DuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  CallsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: call_sid
          AttributeType: S
      KeySchema:
        - AttributeName: call_sid
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # --- CloudWatch logs -------------------------------------------------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/app"
      RetentionInDays: !Ref LogRetentionDays

  # --- IAM roles -------------------------------------------------------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-twilio-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Ref TwilioAccountSidArn
                  - !Ref TwilioAuthTokenArn
                  - !Ref TwilioFromNumberArn
                  - !Ref TwilioVerifiedCallerIdArn

  # Least-privilege task role: Bedrock bidi stream on the Nova Sonic model,
  # DynamoDB RW on just the two tables, and CloudWatch Logs write.
  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      # bedrock:InvokeModelWithBidirectionalStream is a valid Bedrock action
      # (Nova Sonic bi-di streaming) that cfn-lint's bundled IAM action catalog
      # does not yet list, so W3037 is a false positive here.
      cfn-lint:
        config:
          ignore_checks:
            - W3037
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-nova-sonic-bidi
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModelWithBidirectionalStream
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${NovaModelId}"
        # Separate, narrowly-scoped grant for the OFF-PATH post-call intelligence
        # (app/postcall.py), which calls the Bedrock Converse API on a TEXT model
        # (default amazon.nova-lite-v1:0, EXTRACTION_MODEL_ID). Kept distinct from
        # the Nova Sonic bidi statement above so the extraction grant stays scoped
        # to just the text model ARN(s) and the two policies evolve independently.
        - PolicyName: bedrock-text-extraction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0"
        # Note: the PTP payment-link SMS (app/twilio_client.send_sms) needs NO new
        # IAM. It reuses the task's existing egress (ServiceSecurityGroup allows
        # all outbound to the Twilio API) and the Twilio credentials already
        # injected from Secrets Manager via the TaskDefinition Secrets block.
        - PolicyName: dynamodb-rw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt DuesTable.Arn
                  - !GetAtt CallsTable.Arn
        - PolicyName: cloudwatch-logs-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt AppLogGroup.Arn
                  - !Sub "${AppLogGroup.Arn}:*"

  # --- Networking / security groups -----------------------------------------
  # ALB security group. Ingress is attached as separate SecurityGroupIngress
  # resources (below) because a single CloudFormation ingress rule cannot mix
  # CidrIp and SourcePrefixListId: when EnableCloudFront is "true" the ALB
  # accepts :80/:443 ONLY from the CloudFront origin-facing managed prefix list
  # (so the raw ALB DNS is unreachable over plaintext and the CloudFront TLS
  # front door is enforced); when "false" it accepts :80/:443 from 0.0.0.0/0.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress for the AR Collections ALB.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all egress.

  # --- ALB ingress (CloudFront-only when Option 1 is enabled) ---------------
  # EnableCloudFront=true: lock ingress to CloudFront edge IPs via the managed
  # prefix list so only the CloudFront distribution can reach the ALB origin.
  # Only the :80 rule is created: CloudFront talks to this origin over
  # http-only on port 80 (see Distribution.OriginProtocolPolicy), and no
  # HTTPS:443 listener exists on the ALB in the CloudFront path (HttpsListener
  # requires a certificate). Referencing a managed prefix list counts its
  # entry count (49) against the per-SG rule quota (60), so a second :443
  # prefix-list rule would exceed the limit and is unnecessary here.
  AlbIngressHttpCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableCf
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontOriginFacingPrefixListId
      Description: HTTP from CloudFront origin-facing edge IPs only (Option 1).

  # EnableCloudFront=false: original open ingress (plain ALB / ACM custom domain).
  AlbIngressHttpOpen:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CloudFrontDisabled
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: HTTP (health checks; also redirected to HTTPS when TLS is on).

  AlbIngressHttpsOpen:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CloudFrontDisabled
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS/WSS - Twilio Media Streams WebSocket (wss://).

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB to reach Fargate tasks on the app port.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all egress (Bedrock, DynamoDB, Twilio API, ECR).

  ServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: App port reachable only from the ALB.

  # --- Application Load Balancer (WebSocket/WSS capable) ---------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        # >= 120s so Nova's long-lived bi-di WebSocket is not closed by the ALB
        # idle timeout mid-conversation.
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        # Stickiness keeps a caller's REST + WebSocket on the same task.
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie

  # HTTP:80 listener. Always present (ALB health checks + a reachable endpoint
  # when no cert is configured). It forwards to the app so plaintext testing
  # works; for a live Twilio call the HTTPS:443 listener below carries the wss
  # WebSocket.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # HTTPS:443 listener with an ACM certificate - required for Twilio Media
  # Streams (wss://). Only created when CertificateArn is supplied so the
  # template still validates/deploys without a real certificate.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- CloudFront distribution (Option 1: free AWS-managed TLS front door) ---
  # Puts a CloudFront distribution in front of the HTTP:80 ALB so Twilio Media
  # Streams can connect over wss://<dist>.cloudfront.net/media using the free
  # *.cloudfront.net managed certificate - no custom domain / ACM required.
  # CloudFront supports WebSockets automatically; the wss:// upgrade passes
  # through because the managed AllViewer origin-request policy forwards the
  # Sec-WebSocket-* / Upgrade / Connection headers to the origin, and the
  # managed CachingDisabled cache policy keeps the dynamic /media traffic
  # uncached. Origin read/keepalive timeouts are set to their 60s max so the
  # initial WS 101 Switching Protocols handshake is not cut off.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: EnableCf
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} CloudFront TLS front door for Twilio wss"
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: alb-origin
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              # ALB is HTTP:80 only (no cert on the ALB); CloudFront terminates
              # TLS at the edge and talks plaintext HTTP to the origin.
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: false
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          # Managed CachingDisabled - dynamic REST + WebSocket traffic.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed AllViewer - forwards all viewer headers (including the
          # Sec-WebSocket-* headers) so the wss:// upgrade reaches the origin.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        ViewerCertificate:
          # Free AWS-managed *.cloudfront.net certificate (trusted TLS).
          CloudFrontDefaultCertificate: true

  # --- ECS cluster / service -------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-app"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: NOVA_MODEL_ID
              Value: !Ref NovaModelId
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DUES_TABLE
              Value: !Ref DuesTable
            - Name: CALLS_TABLE
              Value: !Ref CallsTable
            # APP_LOG_GROUP is surfaced to the dashboard UI (via /api/config) so
            # it can build a per-call CloudWatch Logs Insights deep link filtered
            # by call_sid. Keep in sync with the awslogs-group below.
            - Name: APP_LOG_GROUP
              Value: !Ref AppLogGroup
            # TEXT model used by the off-path post-call intelligence extraction
            # (Bedrock Converse). Non-secret; matches app/config.py
            # EXTRACTION_MODEL_ID and the bedrock-text-extraction grant above.
            - Name: EXTRACTION_MODEL_ID
              Value: amazon.nova-lite-v1:0
            # Base URL for the PTP payment-link SMS. Non-secret placeholder;
            # override with the real pay URL at deploy time. Matches
            # app/config.py PAYMENT_LINK_BASE_URL.
            - Name: PAYMENT_LINK_BASE_URL
              Value: https://pay.example.com/
            # PUBLIC_BASE_URL drives the TwiML wss://<host>/media URL.
            # Precedence: (1) CloudFront domain when Option 1 is enabled (free
            # managed TLS); (2) the ACM-covered TLS hostname when PublicHostname
            # is set; (3) the raw ALB DNS (HTTP-only/internal testing). The app
            # normalizes whatever host it receives to wss://<host>/media.
            - Name: PUBLIC_BASE_URL
              Value: !If
                - EnableCf
                - !GetAtt Distribution.DomainName
                - !If
                  - HasPublicHostname
                  - !Ref PublicHostname
                  - !GetAtt LoadBalancer.DNSName
          # Twilio credentials are injected from Secrets Manager/SSM by ARN;
          # no secret value appears in this template.
          Secrets:
            - Name: TWILIO_ACCOUNT_SID
              ValueFrom: !Ref TwilioAccountSidArn
            - Name: TWILIO_AUTH_TOKEN
              ValueFrom: !Ref TwilioAuthTokenArn
            - Name: TWILIO_FROM_NUMBER
              ValueFrom: !Ref TwilioFromNumberArn
            - Name: TWILIO_VERIFIED_CALLER_ID
              ValueFrom: !Ref TwilioVerifiedCallerIdArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # >= 120s matches the ALB idle timeout so the WebSocket stays open.
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # --- CloudWatch dashboard --------------------------------------------------
  # Observability note (POC approach A): the per-call drill-down link rendered
  # in the dashboard UI is a client-side CloudWatch Logs Insights deep link
  # filtered by call_sid against AppLogGroup. It needs no new IAM and no
  # cloudwatch:PutMetricData, so none is added here. The ARCollections/TTFTms
  # widget below remains an aspirational custom-metric placeholder (nothing
  # emits it yet); wiring it live would be POC approach B (PutMetricData).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-observability"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Call volume (ALB requests)",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Avg TTFT (custom metric: ARCollections/TTFTms)",
                "region": "${AWS::Region}",
                "stat": "Average",
                "metrics": [
                  [ "ARCollections", "TTFTms" ]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Request latency (ALB target response time)",
                "region": "${AWS::Region}",
                "stat": "Average",
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ]
                ]
              }
            },
            {
              "type": "log", "x": 0, "y": 6, "width": 24, "height": 6,
              "properties": {
                "title": "Recent app logs (call lifecycle / metrics JSON lines)",
                "region": "${AWS::Region}",
                "query": "SOURCE '${AppLogGroup}' | fields @timestamp, @message | sort @timestamp desc | limit 50"
              }
            }
          ]
        }

  # --- CloudTrail (management events) ---------------------------------------
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true

Outputs:
  PublicBaseUrl:
    Description: >-
      Host used for PUBLIC_BASE_URL (TwiML emits wss://<this>/media). The
      CloudFront domain when Option 1 (EnableCloudFront) is on, else the TLS
      hostname when PublicHostname is set, else the raw ALB DNS. A live Twilio
      call REQUIRES a TLS endpoint (CloudFront, or CertificateArn +
      PublicHostname); the raw ALB DNS has no certificate and Twilio will
      refuse wss:// to it.
    Value: !If
      - EnableCf
      - !GetAtt Distribution.DomainName
      - !If
        - HasPublicHostname
        - !Ref PublicHostname
        - !GetAtt LoadBalancer.DNSName
  AlbDnsName:
    Description: >-
      Raw ALB DNS name. Point your PublicHostname CNAME/alias record at this.
    Value: !GetAtt LoadBalancer.DNSName
  HttpsEnabled:
    Description: Whether the HTTPS:443 (wss) listener was provisioned.
    Value: !If [HasCertificate, "true", "false"]
  CloudFrontDomainName:
    Condition: EnableCf
    Description: >-
      CloudFront distribution domain (*.cloudfront.net). Twilio Media Streams
      connect over wss://<this>/media via the free AWS-managed TLS cert.
    Value: !GetAtt Distribution.DomainName
  DashboardUrl:
    Description: CloudWatch dashboard console URL.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
  DuesTableName:
    Description: DynamoDB table for due/account records (DUES_TABLE).
    Value: !Ref DuesTable
  CallsTableName:
    Description: DynamoDB table for call analytics (CALLS_TABLE).
    Value: !Ref CallsTable
  AppLogGroupName:
    Description: CloudWatch log group for the app JSON logs.
