AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AR Collections Nova Sonic 2.5 Agent - ECS Fargate service behind an
  Application Load Balancer (WebSocket/WSS capable) bridging Twilio Media
  Streams to Amazon Bedrock Nova Sonic 2.5. Provisions DynamoDB persistence,
  CloudWatch logs + dashboard, a CloudTrail management-event trail, an in-stack
  CodeBuild image build + demo-dues seeding (both via Lambda custom resources),
  and a least-privilege IAM task role scoped to the Nova Sonic model. Pure
  CloudFormation: see DEPLOYMENT.md for the single create-stack command.

Parameters:
  # Optional explicit ECR image URI. Leave blank (default) to use the image the
  # in-stack CodeBuild project builds and pushes to the stack's own ECR repo at
  # <acct>.dkr.ecr.<region>.amazonaws.com/<AppEcrRepo>:<ImageTag>. See DEPLOYMENT.md.
  ContainerImage:
    Type: String
    Default: ""
    Description: >-
      Optional full ECR image URI override. Blank = use the image built in-stack
      by CodeBuild in the stack's ECR repo, tagged ImageTag.
  # In-stack image build (replaces scripts/codebuild_image.sh). CodeBuild clones
  # the PUBLIC GitHub repo (no credentials) and builds infra/buildspec.yml.
  GitHubRepoUrl:
    Type: String
    Default: https://github.com/windson/twilio-nova-sonic-2-5.git
    Description: HTTPS clone URL of the public source repo CodeBuild builds.
  SourceVersion:
    Type: String
    Default: main
    Description: Git branch, tag, or commit sha CodeBuild builds from.
  ImageTag:
    Type: String
    Default: latest
    Description: >-
      Image tag the in-stack CodeBuild build pushes and the ECS task consumes.
      Change it (e.g. to a git sha) and update the stack to force a fresh build.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which to run the Fargate service and ALB.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets (different AZs) for the ALB and tasks.
  NovaModelId:
    Type: String
    Default: amazon.nova-2-5-sonic
    Description: Bedrock Nova Sonic 2.5 model id (verified streaming in us-east-1).
  ExtractionModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    AllowedValues:
      - amazon.nova-lite-v1:0
      - amazon.nova-micro-v1:0
    Description: >-
      TEXT model for the off-path post-call extraction (Bedrock Converse). Feeds
      BOTH the EXTRACTION_MODEL_ID env var AND the bedrock-text-extraction IAM
      grant Resource so they cannot drift. See DEPLOYMENT.md.
  OtelEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Master switch for GA Strands OTEL telemetry (spans auto-emitted by the
      bidi agent loop). See DEPLOYMENT.md.
  OtelExporter:
    Type: String
    Default: console
    AllowedValues:
      - console
      - otlp
      - none
    Description: >-
      OTEL span exporter. console (default) -> stdout -> awslogs -> CloudWatch
      (no new IAM/infra); otlp -> OtelExporterOtlpEndpoint; none disables export.
  OtelExporterOtlpEndpoint:
    Type: String
    Default: ""
    Description: OTLP collector endpoint URL (only when OtelExporter=otlp).
  TwilioAccountSidArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio account SID (by ARN only).
  TwilioAuthTokenArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio auth token.
  TwilioFromNumberArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio from number.
  TwilioVerifiedCallerIdArn:
    Type: String
    Description: Secrets Manager/SSM ARN holding the Twilio verified caller id.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Number of Fargate tasks to run.
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch log retention (days) for the app log group.
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate ARN for HTTPS:443 (required for live Twilio wss://). Blank
      = HTTP:80-only ALB (health checks / internal testing). See DEPLOYMENT.md.
  PublicHostname:
    Type: String
    Default: ""
    Description: >-
      Public DNS hostname (CNAME/alias to the ALB, covered by CertificateArn)
      used for PUBLIC_BASE_URL -> wss://<hostname>/media. See DEPLOYMENT.md.
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Option 1 (CloudFront TLS front door). true = provision CloudFront in front
      of the HTTP:80 ALB for a free *.cloudfront.net wss:// hostname and lock ALB
      ingress to the CloudFront origin-facing prefix list. See DEPLOYMENT.md.
  CloudFrontOriginFacingPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: >-
      Managed prefix list id for com.amazonaws.global.cloudfront.origin-facing
      (us-east-1 default pl-3b927c52); restricts ALB ingress to CloudFront edge
      IPs when EnableCloudFront=true. See DEPLOYMENT.md.
  UseVpcOrigin:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Option 2 (CloudFront VPC origin). true (with EnableCloudFront=true) = ALB
      INTERNAL in PrivateSubnetIds (no public IP), tasks private with NAT egress,
      CloudFront reaches the origin via a service-managed VpcOrigin ENI. Requires
      PrivateSubnetIds and NatGatewaySubnetId. See DEPLOYMENT.md.
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Existing private subnets (>=2 AZs) for the internal ALB, VPC origin ENI,
      and tasks when UseVpcOrigin=true; blank = stack provisions them. See
      DEPLOYMENT.md.
  NatGatewaySubnetId:
    Type: String
    Default: ""
    Description: >-
      Public subnet for the NAT gateway when UseVpcOrigin=true (restores private
      tasks' outbound egress). Blank when UseVpcOrigin=false. See DEPLOYMENT.md.

Conditions:
  # HTTPS/WSS only when an ACM cert is supplied (template still deploys without).
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasPublicHostname: !Not [!Equals [!Ref PublicHostname, ""]]
  # Option 1 CloudFront on/off (gates distribution, outputs, ALB ingress style).
  EnableCf: !Equals [!Ref EnableCloudFront, "true"]
  CloudFrontDisabled: !Not [!Equals [!Ref EnableCloudFront, "true"]]
  # Option 2 active only when BOTH EnableCloudFront and UseVpcOrigin are true.
  UseVpcOriginCond: !And
    - !Equals [!Ref EnableCloudFront, "true"]
    - !Equals [!Ref UseVpcOrigin, "true"]
  # Option 1 prefix-list ALB path: CloudFront on WITHOUT the VPC origin
  # (mutually exclusive with UseVpcOriginCond).
  CloudFrontPrefixListOrigin: !And
    - !Equals [!Ref EnableCloudFront, "true"]
    - !Not [!Equals [!Ref UseVpcOrigin, "true"]]
  # VPC-origin active AND no PrivateSubnetIds supplied -> stack provisions them.
  ProvisionPrivateSubnets: !And
    - !Condition UseVpcOriginCond
    - !Equals [!Join ["", !Ref PrivateSubnetIds], ""]
  HasOtelEndpoint: !Not [!Equals [!Ref OtelExporterOtlpEndpoint, ""]]
  # Use the in-stack CodeBuild image (stack ECR repo) unless ContainerImage set.
  HasContainerImageOverride: !Not [!Equals [!Ref ContainerImage, ""]]

Resources:
  # --- DynamoDB persistence --------------------------------------------------
  DuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  CallsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: call_sid
          AttributeType: S
      KeySchema:
        - AttributeName: call_sid
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # --- ECR repository (holds the in-stack CodeBuild image) -------------------
  AppEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-app"
      ImageScanningConfiguration:
        ScanOnPush: true

  # --- In-stack image build (replaces scripts/codebuild_image.sh) ------------
  # CodeBuild clones the PUBLIC GitHub repo (no SourceCredential needed) and
  # runs infra/buildspec.yml to build + push the image to AppEcrRepo. Triggered
  # on Create/Update by the ImageBuildTrigger custom resource below.
  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/codebuild/${AWS::StackName}-image-build"
      RetentionInDays: !Ref LogRetentionDays

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-and-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt CodeBuildLogGroup.Arn
                  - !Sub "${CodeBuildLogGroup.Arn}:*"
              # ECR auth token is a wildcard-only action (not resource-scopable).
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt AppEcrRepo.Arn

  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-image-build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      # privilegedMode=true is required to run the Docker daemon for docker build.
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPO
            Value: !Ref AppEcrRepo
          - Name: IMAGE_TAG
            Value: !Ref ImageTag
      Source:
        Type: GITHUB
        Location: !Ref GitHubRepoUrl
        BuildSpec: infra/buildspec.yml
      SourceVersion: !Ref SourceVersion
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
      TimeoutInMinutes: 30

  ImageBuildFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: start-and-poll-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt ImageBuildProject.Arn

  # Lambda-backed custom resource: on Create/Update it starts the CodeBuild
  # build and polls BatchGetBuilds until completion, then signals CloudFormation
  # (cfnresponse). It re-invokes itself while the build is IN_PROGRESS so it
  # never exceeds the Lambda timeout. Delete is a no-op.
  ImageBuildFn:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      Role: !GetAtt ImageBuildFnRole.Arn
      Environment:
        Variables:
          PROJECT_NAME: !Ref ImageBuildProject
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          cb = boto3.client("codebuild")
          lam = boto3.client("lambda")

          def send(event, context, status, data=None, pid=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or ("see " + context.log_stream_name),
                  "PhysicalResourceId": pid or context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False, "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)

          def handler(event, context):
              rt = event.get("RequestType")
              try:
                  if rt == "Delete":
                      return send(event, context, "SUCCESS", {}, event.get("PhysicalResourceId"))
                  build_id = event.get("BuildId")
                  if not build_id:
                      import os
                      resp = cb.start_build(projectName=os.environ["PROJECT_NAME"])
                      build_id = resp["build"]["id"]
                  status = cb.batch_get_builds(ids=[build_id])["builds"][0]["buildStatus"]
                  if status == "IN_PROGRESS":
                      ev = dict(event); ev["BuildId"] = build_id
                      lam.invoke(FunctionName=context.function_name,
                                 InvocationType="Event", Payload=json.dumps(ev).encode())
                      return
                  if status == "SUCCEEDED":
                      return send(event, context, "SUCCESS", {"BuildId": build_id}, build_id)
                  return send(event, context, "FAILED", {}, build_id, "build %s: %s" % (build_id, status))
              except Exception as e:
                  return send(event, context, "FAILED", {}, event.get("PhysicalResourceId"), str(e))

  # Triggering custom resource. ImageTag is a property so changing the tag (or
  # SourceVersion) on a stack update re-runs the build for the new source.
  ImageBuildTrigger:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt ImageBuildFn.Arn
      ImageTag: !Ref ImageTag
      SourceVersion: !Ref SourceVersion

  # --- CloudWatch logs -------------------------------------------------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/app"
      RetentionInDays: !Ref LogRetentionDays

  # --- IAM roles -------------------------------------------------------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-twilio-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Ref TwilioAccountSidArn
                  - !Ref TwilioAuthTokenArn
                  - !Ref TwilioFromNumberArn
                  - !Ref TwilioVerifiedCallerIdArn

  # Least-privilege task role: Bedrock bidi on Nova Sonic, Bedrock Converse on
  # the text extraction model, AgentCore code-interpreter (off-path date
  # resolution), DynamoDB RW on the two tables, and CloudWatch Logs write.
  TaskRole:
    Type: AWS::IAM::Role
    Metadata:
      # W3037: bedrock:InvokeModelWithBidirectionalStream and the
      # bedrock-agentcore:*CodeInterpreter* actions are valid IAM actions not yet
      # in cfn-lint's bundled catalog (false positive).
      cfn-lint:
        config:
          ignore_checks:
            - W3037
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: bedrock-nova-sonic-bidi
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModelWithBidirectionalStream
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${NovaModelId}"
        # Off-path post-call extraction (app/postcall.py) via Bedrock Converse on
        # the TEXT model; also reused by app/code_interpreter.py to author the
        # date-resolution program. Scoped to exactly ExtractionModelId so grant
        # and EXTRACTION_MODEL_ID env var cannot drift.
        - PolicyName: bedrock-text-extraction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${ExtractionModelId}"
        # Off-path natural-language date resolution (app/code_interpreter.py):
        # start/invoke/stop against the managed aws.codeinterpreter.v1 default.
        # Runs only in the post-call task, never on the audio path.
        - PolicyName: agentcore-code-interpreter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:StartCodeInterpreterSession
                  - bedrock-agentcore:InvokeCodeInterpreter
                  - bedrock-agentcore:StopCodeInterpreterSession
                Resource:
                  - !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:code-interpreter/*"
        # Note: the PTP payment-link SMS (app/twilio_client.send_sms) needs NO new
        # IAM (reuses task egress + the Twilio secrets injected into the task).
        - PolicyName: dynamodb-rw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt DuesTable.Arn
                  - !GetAtt CallsTable.Arn
        - PolicyName: cloudwatch-logs-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt AppLogGroup.Arn
                  - !Sub "${AppLogGroup.Arn}:*"

  # --- Demo-dues seeding (replaces scripts/seed_dues.py) ---------------------
  # Lambda-backed custom resource: on Create it PutItems ACC-1001 / ACC-1002
  # into DuesTable with the same schema app/store._seed_dues writes (idempotent
  # put_item). Update/Delete are no-ops. Role scoped to PutItem on DuesTable.
  SeedDuesFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: seed-dues
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt DuesTable.Arn

  SeedDuesFn:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      Role: !GetAtt SeedDuesFnRole.Arn
      Environment:
        Variables:
          DUES_TABLE: !Ref DuesTable
      Code:
        ZipFile: |
          import json, os, urllib.request
          from datetime import datetime, timezone
          from decimal import Decimal
          import boto3

          def send(event, context, status, data=None, pid=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or ("see " + context.log_stream_name),
                  "PhysicalResourceId": pid or "seed-dues",
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False, "Data": data or {},
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req)

          def records():
              now = datetime.now(timezone.utc).isoformat()
              return [
                  {"account_id": "ACC-1001", "debtor_name": "Jordan Rivera",
                   "amount_due": Decimal("428.57"), "currency": "USD",
                   "due_date": "2024-05-15", "status": "open", "notes": "",
                   "phone": None, "collection_paused": False, "escalated": False,
                   "last_updated": now},
                  {"account_id": "ACC-1002", "debtor_name": "Pavan Navule",
                   "amount_due": Decimal("1250.00"), "currency": "USD",
                   "due_date": "2024-06-01", "status": "open", "notes": "",
                   "phone": None, "collection_paused": False, "escalated": False,
                   "last_updated": now},
              ]

          def handler(event, context):
              try:
                  if event.get("RequestType") in ("Update", "Delete"):
                      return send(event, context, "SUCCESS", {}, event.get("PhysicalResourceId"))
                  table = boto3.resource("dynamodb").Table(os.environ["DUES_TABLE"])
                  for rec in records():
                      table.put_item(Item=rec)
                  return send(event, context, "SUCCESS", {"Seeded": 2})
              except Exception as e:
                  return send(event, context, "FAILED", {}, event.get("PhysicalResourceId"), str(e))

  SeedDuesTrigger:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt SeedDuesFn.Arn
      DuesTable: !Ref DuesTable

  # --- Networking / security groups -----------------------------------------
  # ALB SG. Ingress is attached as separate SecurityGroupIngress resources
  # because one rule cannot mix CidrIp and SourcePrefixListId: CloudFront on ->
  # :80/:443 from the origin-facing prefix list only; off -> from 0.0.0.0/0.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ingress for the AR Collections ALB.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all egress.

  # Option 1 (CloudFront, no VPC origin): lock :80 ingress to the CloudFront
  # origin-facing prefix list. Only :80 (CloudFront talks http-only to origin;
  # the prefix list's ~49 entries against the 60-rule quota preclude a 2nd rule).
  AlbIngressHttpCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CloudFrontPrefixListOrigin
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontOriginFacingPrefixListId
      Description: HTTP from CloudFront origin-facing edge IPs only (Option 1).

  # Option 2 (CloudFront VPC origin): ALB is internal, reached only via the VPC
  # origin ENI. Per AWS VPC-origins guidance the origin SG is opened to the
  # origin-facing prefix list (avoids a circular dep on CloudFront's managed SG);
  # the security gain is the ALB being internal/no-public-IP in a private subnet.
  AlbIngressHttpVpcOriginV4:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseVpcOriginCond
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontOriginFacingPrefixListId
      Description: HTTP from the CloudFront VPC origin (IPv4 origin-facing).

  # CloudFront off: original open ingress (plain ALB / ACM custom domain).
  AlbIngressHttpOpen:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CloudFrontDisabled
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: HTTP (health checks; also redirected to HTTPS when TLS is on).

  AlbIngressHttpsOpen:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CloudFrontDisabled
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS/WSS - Twilio Media Streams WebSocket (wss://).

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB to reach Fargate tasks on the app port.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all egress (Bedrock, DynamoDB, Twilio API, ECR).

  ServiceIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: App port reachable only from the ALB.

  # --- Private networking the VPC origin requires (Option 2) -----------------
  # Only under UseVpcOriginCond. The target VPC ships only public subnets, so
  # the stack carves two non-overlapping IPv4 /24 private subnets (VPC is
  # 10.0.0.0/16; 10.0.1/2.0.0/24 used by public subnets). IPv4-only because the
  # externally-owned VPC's IPv6 CIDR is not a GetAtt-able stack attribute.
  # Created even when PrivateSubnetIds is supplied (harmless/unreferenced then).
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: UseVpcOriginCond
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: UseVpcOriginCond
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false

  # Private-subnet egress: tasks move to private subnets (no public IP) and
  # reach Twilio REST + AWS endpoints (Bedrock/DynamoDB/ECR/Logs/AgentCore) via
  # a NAT gateway in NatGatewaySubnetId. Only under UseVpcOriginCond.
  NatEip:
    Type: AWS::EC2::EIP
    Condition: UseVpcOriginCond
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseVpcOriginCond
    Metadata:
      # W1030: false positive - cfn-lint resolves the empty-string DEFAULT of
      # NatGatewaySubnetId against the Subnet::Id regex; the default only exists
      # for the UseVpcOrigin=false path (this resource is not created then).
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref NatGatewaySubnetId

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: UseVpcOriginCond
    Properties:
      VpcId: !Ref VpcId

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: UseVpcOriginCond
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # Associate the private route table (NAT default route) with each private
  # subnet (stack-created or operator-supplied).
  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: UseVpcOriginCond
    Metadata:
      # W1035: false positive - !Select resolves against the empty-list DEFAULT
      # of PrivateSubnetIds on the supplied-list branch, only taken when an
      # operator actually supplies the list.
      cfn-lint:
        config:
          ignore_checks:
            - W1035
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !If
        - ProvisionPrivateSubnets
        - !Ref PrivateSubnet1
        - !Select [0, !Ref PrivateSubnetIds]

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: UseVpcOriginCond
    Metadata:
      # W1035: same empty-default false positive as PrivateSubnet1RouteAssoc.
      cfn-lint:
        config:
          ignore_checks:
            - W1035
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !If
        - ProvisionPrivateSubnets
        - !Ref PrivateSubnet2
        - !Select [1, !Ref PrivateSubnetIds]

  # --- Application Load Balancer (WebSocket/WSS capable) ---------------------
  # Internal in private subnets when UseVpcOrigin=true (reached only via the VPC
  # origin ENI), else internet-facing in public subnets. Scheme + Subnets
  # require replacement, so flipping an existing stack REPLACES the ALB. IPv4.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      # W1030: false positive - !If false branch !Ref PrivateSubnetIds empty
      # default resolved against the subnet-id regex; that branch is only taken
      # when UseVpcOrigin=true with real subnet ids.
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      Type: application
      Scheme: !If [UseVpcOriginCond, internal, internet-facing]
      # IPv4 in both postures (sufficient for the private VPC-origin path; a
      # dualstack internal ALB would need per-subnet IPv6 /64s sliced from an
      # Amazon-provided VPC block, not derivable in one pass for an external VPC).
      IpAddressType: ipv4
      Subnets: !If
        - UseVpcOriginCond
        - !If
          - ProvisionPrivateSubnets
          - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          - !Ref PrivateSubnetIds
        - !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        # >= 120s so Nova's long-lived bi-di WebSocket is not idle-timed out.
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      # Posture-specific Name forces the TG to be replaced in lock step with the
      # ALB when UseVpcOrigin flips (ELB forbids one TG on two load balancers);
      # the two names coexist during the swap, then the old one is cleaned up.
      Name: !If [UseVpcOriginCond, arcol-tg-vpcorigin, arcol-tg-internet]
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        # Stickiness keeps a caller's REST + WebSocket on the same task.
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie

  # HTTP:80 listener. Always present (health checks + a reachable endpoint when
  # no cert is configured); the HTTPS:443 listener below carries live wss.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # HTTPS:443 (wss) listener with an ACM cert - required for Twilio Media
  # Streams. Only created when CertificateArn is supplied.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # --- CloudFront VPC origin (Option 2) -------------------------------------
  # Service-managed VPC origin fronting the INTERNAL ALB. The distribution
  # references it per-origin via VpcOriginConfig (private ENI) rather than a
  # public DomainName. http-only:80 mirrors the ALB HTTP listener (CloudFront
  # terminates TLS at the edge). Created only under UseVpcOriginCond.
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Condition: UseVpcOriginCond
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub "${AWS::StackName}-alb-vpc-origin"
        Arn: !Ref LoadBalancer
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only
        IpAddressType: ipv4

  # --- CloudFront distribution (Option 1: free AWS-managed TLS front door) ---
  # Fronts the HTTP:80 ALB so Twilio connects over wss://<dist>.cloudfront.net/
  # media with the free managed cert (no domain/ACM). WebSockets pass through
  # via the managed AllViewer origin-request policy (forwards Sec-WebSocket-*/
  # Upgrade/Connection) and CachingDisabled; 60s origin timeouts keep the WS 101
  # handshake open.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: EnableCf
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} CloudFront TLS front door for Twilio wss"
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          # Single origin; connection style selected by UseVpcOrigin. Option 2:
          # VpcOriginConfig -> the internal ALB via the service-managed ENI.
          # Option 1/plain: public CustomOriginConfig to the ALB DNS. DomainName
          # is required by CloudFront in both styles.
          - Id: alb-origin
            DomainName: !GetAtt LoadBalancer.DNSName
            VpcOriginConfig: !If
              - UseVpcOriginCond
              - VpcOriginId: !GetAtt VpcOrigin.Id
                OriginReadTimeout: 60
                OriginKeepaliveTimeout: 60
              - !Ref AWS::NoValue
            CustomOriginConfig: !If
              - UseVpcOriginCond
              - !Ref AWS::NoValue
              # ALB is HTTP:80 only; CloudFront terminates TLS at the edge.
              - OriginProtocolPolicy: http-only
                HTTPPort: 80
                OriginReadTimeout: 60
                OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: false
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          # Managed CachingDisabled - dynamic REST + WebSocket traffic.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed AllViewer - forwards the Sec-WebSocket-* headers for wss.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        ViewerCertificate:
          # Free AWS-managed *.cloudfront.net certificate (trusted TLS).
          CloudFrontDefaultCertificate: true

  # --- ECS cluster / service -------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    # Wait for the in-stack image build so the task consumes a pushed image.
    DependsOn: ImageBuildTrigger
    Properties:
      Family: !Sub "${AWS::StackName}-app"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          # Use the explicit ContainerImage override when set, else the image
          # the in-stack CodeBuild build pushed to the stack's ECR repo:ImageTag.
          Image: !If
            - HasContainerImageOverride
            - !Ref ContainerImage
            - !Sub "${AppEcrRepo.RepositoryUri}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: NOVA_MODEL_ID
              Value: !Ref NovaModelId
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DUES_TABLE
              Value: !Ref DuesTable
            - Name: CALLS_TABLE
              Value: !Ref CallsTable
            # APP_LOG_GROUP -> /api/config -> per-call CloudWatch Logs Insights
            # deep link. Keep in sync with the awslogs-group below.
            - Name: APP_LOG_GROUP
              Value: !Ref AppLogGroup
            # TEXT model for off-path post-call extraction; driven by
            # ExtractionModelId so this env var and the IAM grant never drift.
            - Name: EXTRACTION_MODEL_ID
              Value: !Ref ExtractionModelId
            # PTP payment-link SMS base URL (non-secret placeholder; override at
            # deploy). Matches app/config.py PAYMENT_LINK_BASE_URL.
            - Name: PAYMENT_LINK_BASE_URL
              Value: https://pay.example.com/
            # PUBLIC_BASE_URL -> TwiML wss://<host>/media. Precedence: CloudFront
            # domain (Option 1) -> ACM hostname -> raw ALB DNS.
            - Name: PUBLIC_BASE_URL
              Value: !If
                - EnableCf
                - !GetAtt Distribution.DomainName
                - !If
                  - HasPublicHostname
                  - !Ref PublicHostname
                  - !GetAtt LoadBalancer.DNSName
            # GA Strands OTEL telemetry. Default console exporter -> stdout ->
            # awslogs -> CloudWatch (no new IAM/infra). Only otlp needs a
            # collector. See DEPLOYMENT.md.
            - Name: OTEL_ENABLED
              Value: !Ref OtelEnabled
            - Name: OTEL_EXPORTER
              Value: !Ref OtelExporter
            - !If
              - HasOtelEndpoint
              - Name: OTEL_EXPORTER_OTLP_ENDPOINT
                Value: !Ref OtelExporterOtlpEndpoint
              - !Ref AWS::NoValue
          # Twilio credentials injected from Secrets Manager/SSM by ARN (no
          # secret value in this template).
          Secrets:
            - Name: TWILIO_ACCOUNT_SID
              ValueFrom: !Ref TwilioAccountSidArn
            - Name: TWILIO_AUTH_TOKEN
              ValueFrom: !Ref TwilioAuthTokenArn
            - Name: TWILIO_FROM_NUMBER
              ValueFrom: !Ref TwilioFromNumberArn
            - Name: TWILIO_VERIFIED_CALLER_ID
              ValueFrom: !Ref TwilioVerifiedCallerIdArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Metadata:
      # W1030: false positive - !If false branch !Ref PrivateSubnetIds empty
      # default resolved against the subnet-id regex (only taken when
      # UseVpcOrigin=true with real subnet ids).
      cfn-lint:
        config:
          ignore_checks:
            - W1030
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # >= 120s matches the ALB idle timeout so the WebSocket stays open.
      HealthCheckGracePeriodSeconds: 120
      # UseVpcOrigin=true: tasks run private (AssignPublicIp DISABLED) with NAT
      # egress; else public-subnet + AssignPublicIp ENABLED.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !If [UseVpcOriginCond, DISABLED, ENABLED]
          Subnets: !If
            - UseVpcOriginCond
            - !If
              - ProvisionPrivateSubnets
              - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
              - !Ref PrivateSubnetIds
            - !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # --- CloudWatch dashboard --------------------------------------------------
  # The per-call drill-down link in the UI is a client-side CloudWatch Logs
  # Insights deep link (no new IAM, no PutMetricData). The ARCollections/TTFTms
  # widget is an aspirational custom-metric placeholder (nothing emits it yet).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-observability"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Call volume (ALB requests)",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Avg TTFT (custom metric: ARCollections/TTFTms)",
                "region": "${AWS::Region}",
                "stat": "Average",
                "metrics": [
                  [ "ARCollections", "TTFTms" ]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Request latency (ALB target response time)",
                "region": "${AWS::Region}",
                "stat": "Average",
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}" ]
                ]
              }
            },
            {
              "type": "log", "x": 0, "y": 6, "width": 24, "height": 6,
              "properties": {
                "title": "Recent app logs (call lifecycle / metrics JSON lines)",
                "region": "${AWS::Region}",
                "query": "SOURCE '${AppLogGroup}' | fields @timestamp, @message | sort @timestamp desc | limit 50"
              }
            }
          ]
        }

  # --- CloudTrail (management events) ---------------------------------------
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true

Outputs:
  PublicBaseUrl:
    Description: >-
      Host for PUBLIC_BASE_URL (TwiML emits wss://<this>/media): CloudFront
      domain (Option 1) else PublicHostname else raw ALB DNS. A live call needs
      a TLS endpoint.
    Value: !If
      - EnableCf
      - !GetAtt Distribution.DomainName
      - !If
        - HasPublicHostname
        - !Ref PublicHostname
        - !GetAtt LoadBalancer.DNSName
  AlbDnsName:
    Description: Raw ALB DNS name. Point your PublicHostname CNAME/alias at this.
    Value: !GetAtt LoadBalancer.DNSName
  HttpsEnabled:
    Description: Whether the HTTPS:443 (wss) listener was provisioned.
    Value: !If [HasCertificate, "true", "false"]
  CloudFrontDomainName:
    Condition: EnableCf
    Description: >-
      CloudFront distribution domain (*.cloudfront.net). Twilio connects over
      wss://<this>/media via the free AWS-managed TLS cert.
    Value: !GetAtt Distribution.DomainName
  DashboardUrl:
    Description: CloudWatch dashboard console URL.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
  EcrRepositoryUri:
    Description: ECR repo the in-stack CodeBuild build pushes the app image to.
    Value: !GetAtt AppEcrRepo.RepositoryUri
  ContainerImageUri:
    Description: Full image URI the ECS task consumes (override or built image).
    Value: !If
      - HasContainerImageOverride
      - !Ref ContainerImage
      - !Sub "${AppEcrRepo.RepositoryUri}:${ImageTag}"
  DuesTableName:
    Description: DynamoDB table for due/account records (DUES_TABLE).
    Value: !Ref DuesTable
  CallsTableName:
    Description: DynamoDB table for call analytics (CALLS_TABLE).
    Value: !Ref CallsTable
  AppLogGroupName:
    Description: CloudWatch log group for the app JSON logs.
    Value: !Ref AppLogGroup
  CloudTrailName:
    Description: CloudTrail trail recording management events.
    Value: !Ref Trail
  ProvisionedPrivateSubnetIds:
    Condition: UseVpcOriginCond
    Description: >-
      Private subnet ids backing the internal ALB, VPC origin ENI, and tasks
      when UseVpcOrigin=true: stack-created when PrivateSubnetIds was blank, else
      the operator-supplied list.
    Value: !If
      - ProvisionPrivateSubnets
      - !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
      - !Join [",", !Ref PrivateSubnetIds]
